# Weekly live-loss diagnosis (draft, Prism 2026-10-05). Read-only: public HL info API + trade-log CSV. No exchange keys, no orders.
name: live_loss weekly
on:
  schedule:
    - cron: '30 0 * * 1'   # Mon 00:30 UTC = Mon 08:30 HKT (after 08:05 scan, before desk)
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO week, e.g. 2026-W40 (blank = last full ISO week)'
        required: false
permissions:
  contents: read    # read-only checkout; results are NEVER committed (artifact only)
  issues: write     # open an issue on failure
concurrency: { group: live-loss, cancel-in-progress: false }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Trade log is NOT in this repo. Secret only (keeps the URL private; masked in logs).
      LIVE_LOSS_TRADES: ${{ secrets.LIVE_LOSS_TRADES_URL }}
      LIVE_LOSS_TRADES_TOKEN: ${{ secrets.LIVE_LOSS_TRADES_TOKEN }}   # optional bearer; never printed
      LIVE_LOSS_WALLET: '0xcFCda0F8576a268BaA17935368081F4e687dB122'  # public HL main wallet (already public in executor.py)
      LIVE_LOSS_MCAP: data/mcap_cache.json
      LIVE_LOSS_BT: live_loss/bt_ref.json
      WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet 'pandas>=2.1,<3' 'numpy<3'
      - name: Check trade-log input is wired
        run: |
          if [ -z "$LIVE_LOSS_TRADES" ]; then echo "::error::repo secret LIVE_LOSS_TRADES_URL not set - see live_loss/README.md"; exit 1; fi
      - name: Diagnose (stdout to artifact only; repo is PUBLIC so P&L must not appear in the job log)
        run: |
          mkdir -p live_loss/out
          python live_loss/diagnose.py --strict ${WEEK:+--week "$WEEK"} > live_loss/out/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'live-loss-${{ github.run_id }}', path: live_loss/out/, retention-days: 90, if-no-files-found: warn }
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: `live_loss weekly failed (${new Date().toISOString().slice(0,10)})`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nSee live_loss/README.md "Common faults".`});
