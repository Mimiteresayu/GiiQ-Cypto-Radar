name: Scout Daily Screen

on:
  schedule:
    # 09:30 HKT weekdays = 01:30 UTC (HKT = UTC+8)
    - cron: '30 1 * * 1-5'
  
  workflow_dispatch:
  
  pull_request:
    paths:
      - 'scout/**'
      - '.github/workflows/scout_screen.yml'

permissions:
  contents: write
  issues: write

jobs:
  scout-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for branch operations
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scout
          python3 discover.py --top-n 20 --timeout-per-screen 900
      
      - name: Upload artifacts (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scout-outputs-${{ github.sha }}
          path: scout/out/
      
      - name: Commit and push to scout-out branch (schedule/dispatch only)
        if: github.event_name != 'pull_request'
        run: |
          # Configure git
          git config user.name "Scout Bot"
          git config user.email "scout@giiq.bot"
          
          # Create or switch to scout-out branch
          git fetch origin scout-out || true
          git checkout scout-out 2>/dev/null || git checkout -b scout-out
          
          # Merge latest changes from main (scout directory only)
          git checkout origin/main -- scout/ || true
          
          # Stage outputs
          git add scout/out/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Commit with [skip ci] to prevent triggering this workflow again
            git commit -m "Scout daily screen $(date -u +%Y-%m-%d) [skip ci]"
            
            # Push to scout-out branch
            git push origin scout-out
          fi
      
      - name: Create issue on failure (schedule/dispatch only)
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scout screen failed ${date}`,
              body: `The scheduled Scout discovery and screening job failed on ${date}.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['scout', 'automated-failure']
            });
